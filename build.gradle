plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.myadvancedclock'
    compileSdk 34
    defaultConfig {
        applicationId "com.example.myadvancedclock"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // No external dependencies needed for this simple widget
}
